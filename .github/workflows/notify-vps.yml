name: Publish image and notify VPS deployments

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/georgedanicico/investments-scraper

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The VPS deploys the image tagged with the exact commit SHA it has pinned, so
      # native compilation happens here and never on the VPS.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: native-image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}:native
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Wake the central deployment workflow
        env:
          GH_TOKEN: ${{ secrets.VPS_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::VPS_DISPATCH_TOKEN is not set; vps-apps will pick up this commit on its next sync."
            exit 0
          fi
          gh api --method POST repos/GeorgeDanicico/vps-apps/dispatches \
            -f event_type=upstream-changed
